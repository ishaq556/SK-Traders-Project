<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="signup.css">

    <title>Signup</title>
</head>

<body>
    <div id="container">
        <div id="signup">

            <p>Create Your Account</p>
            <span>join SK Traders and start managing your Installment Business</span>
            <form action="">
                <label for="">Full Name:</label>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Enter Your Name">
                </div>


                <label for="">Email:</label>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Enter Your Email">
                </div>


                <label for="">Phone Number:</label>

                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="number" placeholder="Enter Your Phone Number">
                </div>


                <label for="">Password:</label>

                <div class="input-box">
                    <i class="fa-solid fa-user-lock"></i>
                    <input type="password" placeholder="Create a Password">
                </div>


                <label for="">Confirm Password:</label>

                <div class="input-box">
                    <i class="fa-solid fa-user-lock"></i>
                    <input type="password" placeholder="Confirm Password">
                </div>
                <div id="checkbox-terms">
                    <input type="checkbox" id="checkbox">
                    <p id="Terms">I Agree To Terms & Condtions </p>
                </div>
                <button type="submit" id="signup-button"> Create Account</button>
            </form>
            <div id="Already"> Already have an account? <a href="index.html">Login</a></div>

        </div>
    </div>

</body>

</html>
